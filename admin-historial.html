<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial Detallado - Admin Comidas mi niña</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .admin-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-left: 10px;
            vertical-align: middle;
        }
        .admin-nav-header {
            padding: 20px 25px 10px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 10px;
        }
        .admin-nav-header p {
            color: #f59e0b;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }
        .btn-logout {
            display: block;
            margin: 20px 15px 10px;
            padding: 12px 20px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
        }
        .btn-logout:hover { background: rgba(239, 68, 68, 0.2); }
        .filtros { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .filtro-btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: 2px solid #e2e8f0;
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            transition: all 0.2s;
        }
        .filtro-btn.active, .filtro-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #f0fdf4;
        }
        .semaforo { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
        .semaforo-verde { background: #22c55e; }
        .semaforo-rojo  { background: #ef4444; }
        .table-historial th { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .photo-thumb {
            width: 44px; height: 44px;
            border-radius: 8px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            overflow: hidden;
        }
        .puntos-positivos { color: var(--primary); font-weight: 700; }
        .puntos-negativos { color: #ef4444; font-weight: 700; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
        .empty-state i { font-size: 50px; margin-bottom: 15px; opacity: 0.4; display: block; }
        .totales-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 10px; }
    </style>
</head>
<body>
    <nav>
        <div class="admin-nav-header">
            <div class="brand" style="padding-bottom:0; border-bottom:none; margin-bottom:0;">
                <i class="fas fa-leaf"></i> Comidas mi niña
            </div>
            <p><i class="fas fa-shield-alt"></i> Panel Admin</p>
        </div>
        <ul>
            <li><a href="admin-panel.html"><i class="fas fa-tachometer-alt"></i> Resumen General</a></li>
            <li><a href="admin-historial.html" class="active"><i class="fas fa-history"></i> Historial Detallado</a></li>
            <li><a href="admin-tienda.html"><i class="fas fa-store"></i> Control de Tienda
                <span id="nav-notif-badge" style="display:none;background:#ef4444;color:white;font-size:10px;padding:1px 6px;border-radius:20px;margin-left:4px;font-weight:700;">0</span>
            </a></li>
        </ul>
        <a href="#" class="btn-logout" onclick="cerrarSesion()">
            <i class="fas fa-sign-out-alt" style="margin-right:8px;"></i> Cerrar Sesión
        </a>
    </nav>

    <div class="content">
        <h2 class="animate-fade">
            Historial Detallado
            <span class="admin-badge"><i class="fas fa-crown" style="margin-right:4px;"></i> Admin</span>
        </h2>
        <p style="color:var(--text-light); margin-bottom:20px;">
            Usuario: <strong>Naythan (Mivida)</strong>
        </p>

        <!-- Filtros -->
        <div class="filtros animate-fade delay-1">
            <button class="filtro-btn active" onclick="filtrar('', this)">Todos</button>
            <button class="filtro-btn" onclick="filtrar('Desayuno', this)"><i class="fas fa-sun" style="color:#f472b6;"></i> Desayuno</button>
            <button class="filtro-btn" onclick="filtrar('Comida', this)"><i class="fas fa-hamburger" style="color:#fbbf24;"></i> Comida</button>
            <button class="filtro-btn" onclick="filtrar('Cena', this)"><i class="fas fa-moon" style="color:#38bdf8;"></i> Cena</button>
            <button class="filtro-btn" onclick="filtrar('Merienda', this)"><i class="fas fa-apple-alt" style="color:#22c55e;"></i> Merienda</button>
        </div>

        <!-- Tabla -->
        <div class="card animate-fade delay-2" style="padding:0; overflow:hidden;">
            <table class="table-historial" id="tabla-historial">
                <thead>
                    <tr>
                        <th style="padding:15px;">Emoji</th>
                        <th>Alimento</th>
                        <th>Tipo</th>
                        <th>Día</th>
                        <th>Hora</th>
                        <th>Porción</th>
                        <th>Puntos</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="historial-body"></tbody>
            </table>
        </div>

        <!-- Totales -->
        <div class="totales-grid animate-fade delay-3">
            <div class="card" style="text-align:center; border-left:5px solid var(--primary);">
                <p style="color:var(--text-light); font-size:13px; text-transform:uppercase; letter-spacing:1px;">Total Positivo</p>
                <p id="total-positivo" style="font-size:32px; font-weight:900; color:var(--primary);">0 pts</p>
            </div>
            <div class="card" style="text-align:center; border-left:5px solid #ef4444;">
                <p style="color:var(--text-light); font-size:13px; text-transform:uppercase; letter-spacing:1px;">Total Negativo</p>
                <p id="total-negativo" style="font-size:32px; font-weight:900; color:#ef4444;">0 pts</p>
            </div>
            <div class="card" style="text-align:center; border-left:5px solid #8b5cf6;">
                <p style="color:var(--text-light); font-size:13px; text-transform:uppercase; letter-spacing:1px;">Balance Neto</p>
                <p id="total-neto" style="font-size:32px; font-weight:900; color:#8b5cf6;">0 pts</p>
            </div>
        </div>
    </div>

    <script src="nt-store.js"></script>
<script>
    (function init() {
        if (!NTStore.requireAuth('admin')) return;
        actualizarBadgeNav();
        renderHistorial('');
        setInterval(actualizarBadgeNav, 5000);
    })();

    function cerrarSesion() {
        NTStore.clearSession();
        location.href = 'login.html';
    }

    function actualizarBadgeNav() {
        const p = NTStore.getCanjesPendientes().length;
        const b = document.getElementById('nav-notif-badge');
        if (b) { b.style.display = p > 0 ? 'inline' : 'none'; b.textContent = p; }
    }

    function filtrar(tipo, btn) {
        document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderHistorial(tipo);
    }

    async function renderHistorial(filtro) {
    // El admin siempre ve los datos de Mivida (uid=2)
    const MIVIDA_UID = 2;
    let url = `/api/historial.php?usuario_id=${MIVIDA_UID}&semana=0`;
    if (filtro) url += `&tipo=${encodeURIComponent(filtro)}`;

    const res = await fetch(url);
    const data = await res.json();

    if (!data.ok) {
        document.getElementById('historial-body').innerHTML =
            `<tr><td colspan="8"><div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Error: ${data.error}</p></div></td></tr>`;
        return;
    }

    const regs    = data.registros;
    const totales = data.totales;

    document.getElementById('total-positivo').textContent = `+${totales.ganados} pts`;
    document.getElementById('total-negativo').textContent = `${totales.perdidos} pts`;
    document.getElementById('total-neto').textContent     = `${totales.ganados + totales.perdidos} pts`;

    const tbody = document.getElementById('historial-body');
    tbody.innerHTML = '';

    if (!regs.length) {
        tbody.innerHTML = `<tr><td colspan="8">
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <p>No hay registros para mostrar.</p>
            </div>
        </td></tr>`;
        return;
    }

    regs.forEach(r => {
        const positivo = r.puntos_asignados >= 0;
        const tr = document.createElement('tr');
        tr.style.borderLeft = `3px solid ${positivo ? '#22c55e' : '#ef4444'}`;
        tr.innerHTML = `
            <td style="padding:12px 15px;">
                <div class="photo-thumb">${r.emoji || '🍴'}</div>
            </td>
            <td><strong>${r.nombre_libre}</strong></td>
            <td><span style="color:var(--text-light);font-size:13px;">${r.tipo_comida}</span></td>
            <td style="color:var(--text-light);font-size:13px;">${r.dia_semana} ${r.fecha}</td>
            <td>${r.hora}</td>
            <td><span style="font-size:11px;">${r.porcion}</span></td>
            <td class="${positivo ? 'puntos-positivos' : 'puntos-negativos'}">
                ${positivo ? '+' : ''}${r.puntos_asignados} pts
            </td>
            <td>
                <span class="semaforo semaforo-${positivo ? 'verde' : 'rojo'}"></span>
                ${positivo ? 'Registrado' : 'Trampa'}
            </td>`;
        tbody.appendChild(tr);
    });
}
</script>
</body>
</html>
