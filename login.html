<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Comidas mi niña</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            animation: fadeInUp 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }
        .login-brand {
            text-align: center;
            margin-bottom: 35px;
        }
        .login-brand .logo-icon {
            font-size: 50px;
            color: var(--primary);
            margin-bottom: 10px;
            display: block;
            filter: drop-shadow(0 0 15px rgba(34, 197, 94, 0.5));
        }
        .login-brand h1 {
            font-size: 34px;
            font-weight: 900;
            color: white;
            letter-spacing: 2px;
        }
        .login-brand p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 5px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }
        .login-card h2 {
            color: white;
            font-size: 20px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }
        .login-form-group { margin-bottom: 20px; }
        .login-label {
            display: block;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .login-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
            box-sizing: border-box;
        }
        .login-input::placeholder { color: #475569; }
        .login-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(34, 197, 94, 0.08);
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
        }
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #22c55e, #10b981);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35);
        }
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(34, 197, 94, 0.5);
        }
        .btn-login:active  { transform: translateY(0); }
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: #475569;
            font-size: 13px;
        }
        .input-icon-wrap { position: relative; }
        .input-icon-wrap .fa {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            pointer-events: none;
        }
        .input-icon-wrap .login-input { padding-left: 44px; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        :root {
            --primary: #22c55e;
            --primary-dark: #16a34a;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-brand">
            <i class="fas fa-leaf logo-icon"></i>
            <h1>Comidas mi niña</h1>
            <p>Para que comas bien</p>
        </div>
        <div class="login-card">
            <h2>Bienvenido de vuelta 👋</h2>
            <div class="login-form-group">
                <label class="login-label">Usuario</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" class="login-input" placeholder="Tu nombre de usuario"
                           onkeydown="if(event.key==='Enter') iniciarSesion()">
                </div>
            </div>
            <div class="login-form-group">
                <label class="login-label">Contraseña</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" class="login-input" placeholder="Tu contraseña"
                           onkeydown="if(event.key==='Enter') iniciarSesion()">
                </div>
            </div>
            <button class="btn-login" id="btn-login" onclick="iniciarSesion()">
                <i class="fas fa-sign-in-alt" style="margin-right:8px;"></i> Ingresar
            </button>
            <div class="error-msg" id="error-msg"></div>
        </div>
        <div class="login-footer">
          
        </div>
    </div>

    <script src="nt-store.js"></script>
    <script>
        // Si ya hay sesión activa, redirigir directo
        (function() {
            const { user, role, uid } = NTStore.getSession();
            if (user && uid) {
                location.href = role === 'admin' ? 'admin-panel.html' : 'dashboard.html';
            }
        })();

        async function iniciarSesion() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errDiv   = document.getElementById('error-msg');
            const btn      = document.getElementById('btn-login');

            errDiv.style.display = 'none';

            if (!username || !password) {
                mostrarError('Por favor ingresa usuario y contraseña.');
                return;
            }

            // Deshabilitar botón mientras carga
            btn.disabled  = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i> Verificando...';

            const resultado = await NTStore.login(username, password);

            btn.disabled  = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt" style="margin-right:8px;"></i> Ingresar';

            if (resultado.ok) {
                const rol = resultado.usuario.rol;
                location.href = rol === 'admin' ? 'admin-panel.html' : 'dashboard.html';
            } else {
                mostrarError(resultado.error || 'Usuario o contraseña incorrectos.');
                document.getElementById('password').value = '';
                document.getElementById('username').focus();
            }
        }

        function mostrarError(msg) {
            const errDiv = document.getElementById('error-msg');
            errDiv.innerHTML = `<i class="fas fa-exclamation-circle" style="margin-right:6px;"></i>${msg}`;
            errDiv.style.display = 'block';
        }
    </script>
</body>
</html>
